<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>曲库管理工具</title>
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <header class="topbar"><div><strong>泠鸢歌曲资料库</strong><span>本地维护工具</span></div><button id="validate" class="button button--quiet">校验曲库</button></header>
    <main class="layout">
      <aside class="sidebar"><div class="side-head"><h1>作品</h1><button id="new-work" class="button">新建</button></div><input id="work-filter" class="input" placeholder="搜索作品" /><div id="work-list" class="work-list"></div></aside>
      <section class="editor"><div id="notice" class="notice" hidden></div><form id="form">
        <div class="editor-head"><div><p class="eyebrow">作品资料</p><h2 id="form-title">新建作品</h2></div><button class="button button--primary" type="submit">保存到仓库</button></div>
        <section class="panel"><h3>基本信息</h3><div class="grid two"><label>作品 ID<input class="input" name="id" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" required /></label><label>标题<input class="input" name="title" required /></label><label>年份<input class="input" name="year" inputmode="numeric" placeholder="留空表示未知" /></label><label>别名<input class="input" name="aliases" placeholder="用逗号分隔" /></label></div><label>简介<textarea class="input" name="summary" rows="3"></textarea></label><div><span class="label">标签</span><div id="tags" class="tag-groups"></div></div></section>
        <section class="panel"><div class="section-head"><h3>作品人员</h3><button type="button" class="button button--quiet" data-add-people="work">添加角色</button></div><div id="work-people" class="rows"></div></section>
        <section class="panel"><div class="section-head"><h3>资源</h3><span class="muted">歌词由所有版本共用</span></div><div class="grid two"><label>封面<input class="input" id="cover" type="file" accept=".webp,.jpg,.jpeg,.png" /></label><label>歌词<input class="input" id="lyrics" type="file" accept=".txt" /></label></div><p id="resource-state" class="muted"></p></section>
        <section class="panel"><div class="section-head"><h3>版本</h3><button type="button" class="button button--quiet" id="add-version">添加版本</button></div><div id="versions"></div><div class="preview"><div class="section-head"><h3>最终人员预览</h3><span class="muted">作品人员会被版本差异继承或覆盖</span></div><div id="people-preview" class="preview-grid"></div></div></section>
      </form></section>
    </main>
    <template id="people-row"><div class="person-row"><input class="input role" placeholder="角色，如演唱" /><input class="input names" placeholder="人员，用逗号分隔" /><button type="button" class="icon-button remove" title="删除">×</button></div></template>
    <script type="module" src="/admin.js"></script>
  </body>
</html>
